<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    height:100%;
    background:#111;
    overflow:hidden;
}


/* Name Screen */

#nameScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.box{
    width:90%;
    max-width:350px;
    background:#222;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.box h2{
    color:white;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:16px;
}

.join{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#25D366;
    color:white;
    font-size:17px;
}


/* Chat */

#chat{
    display:none;
    height:100vh;
    flex-direction:column;
}


.header{
    height:60px;
    background:#202020;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}


.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}


.message{
    background:#25D366;
    color:white;
    padding:12px;
    border-radius:15px;
    margin-bottom:10px;
    max-width:80%;
    word-wrap:break-word;
}


.username{
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}



.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    padding-bottom:50px;
    background:#222;
}


textarea{
    flex:1;
    height:45px;
    resize:none;
    border:none;
    outline:none;
    border-radius:25px;
    padding:12px;
    background:#333;
    color:white;
    font-size:16px;
}


.send{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#25D366;
    color:white;
    font-size:20px;
}

</style>

</head>


<body>


<div id="nameScreen">

<div class="box">

<h2>Join Chat</h2>

<input id="name" placeholder="Enter your name">

<button class="join" onclick="join()">
Join
</button>

</div>

</div>



<div id="chat">


<div class="header">
Chat Room
</div>


<div class="messages" id="messages"></div>


<div class="bottom">

<textarea id="text" placeholder="Message..."></textarea>

<button class="send" onclick="send()">
➤
</button>

</div>


</div>




<script>


let username="";


const ws=new WebSocket(
"wss://msg-39zm.onrender.com"
);


const messages=document.getElementById("messages");
const text=document.getElementById("text");



ws.onopen=function(){

console.log("Connected");

};



ws.onerror=function(){

alert("WebSocket Error");

};



function join(){

let name=document.getElementById("name");


if(name.value.trim()==""){
alert("Enter name");
return;
}


if(ws.readyState!==WebSocket.OPEN){
alert("Connecting...");
return;
}


username=name.value.trim();


document.getElementById("nameScreen").style.display="none";

document.getElementById("chat").style.display="flex";


ws.send(JSON.stringify({

type:"join",
username:username

}));

}





function send(){

let msg=text.value.trim();


if(msg=="") return;


ws.send(JSON.stringify({

type:"message",
username:username,
message:msg

}));


text.value="";

}





ws.onmessage=function(event){


let data=JSON.parse(event.data);


let div=document.createElement("div");

div.className="message";


if(data.type=="join"){


div.style.background="#444";


div.innerHTML=
"<div class='username'>System</div>"+
data.username+" joined";


}else{


div.innerHTML=
"<div class='username'>"+
data.username+
"</div>"+
data.message;


}


messages.appendChild(div);


messages.scrollTop=messages.scrollHeight;


};




text.addEventListener("keydown",function(e){


if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

send();

}


});


</script>


</body>
</html>
